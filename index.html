    <header class="w-11/12 sm:w-3/4 md:max-w-6xl mx-auto mt-8">
        <!-- navbar -->
        <nav class="flex items-center justify-between">
            <div class="logo w-20 md:w-[135px]"><img class="w-full" src="/assets/logo.png" alt="">

            <div class="banner-image w-full sm:w-5/6">
